<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warden — local AI gateway</title>
<style>
  /*
   * Served as one static file with no build step. A demo that needs `npm run
   * build` before it can be shown is a demo that fails at the wrong moment, and
   * the whole console is small enough that a bundler would only add ways to
   * break.
   */
  :root {
    --bg: #0d1117; --panel: #161b22; --edge: #262d36;
    --ink: #e6edf3; --dim: #8b949e; --faint: #6e7681;
    --allow: #3fb950; --block: #f85149; --escalate: #d29922; --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--edge); background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; letter-spacing: .5px; }
  header h1 span { color: var(--faint); font-weight: 400; margin-left: 8px; }
  .pill {
    font: 11px/1 var(--mono); padding: 4px 8px; border-radius: 10px;
    border: 1px solid var(--edge); color: var(--dim);
  }
  .pill.live { color: var(--allow); border-color: #1f3d28; }
  .pill.mock { color: var(--escalate); border-color: #3d3418; }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav button {
    background: none; border: 1px solid transparent; color: var(--dim);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  nav button.on { background: var(--bg); border-color: var(--edge); color: var(--ink); }

  main { flex: 1; display: grid; grid-template-columns: 340px 1fr 380px; overflow: hidden; }
  main.single { grid-template-columns: 1fr; }
  section { border-right: 1px solid var(--edge); display: flex; flex-direction: column; overflow: hidden; }
  section:last-child { border-right: none; }
  .head {
    padding: 9px 14px; border-bottom: 1px solid var(--edge);
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .head .ver { margin-left: auto; font-family: var(--mono); text-transform: none; font-size: 10px; }
  .body { flex: 1; overflow-y: auto; padding: 12px 14px; }

  textarea, input, select {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 6px; padding: 8px 10px;
    font-family: inherit; font-size: 12.5px; resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  button.act {
    background: var(--accent); color: #04121f; border: none; border-radius: 6px;
    padding: 7px 14px; font-weight: 600; font-size: 12px; cursor: pointer;
  }
  button.act:disabled { opacity: .4; cursor: default; }
  button.ghost {
    background: none; border: 1px solid var(--edge); color: var(--dim);
    border-radius: 6px; padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }

  .cat { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
  .cat button {
    font-size: 11px; padding: 4px 9px; border-radius: 12px;
    background: none; border: 1px solid var(--edge); color: var(--dim); cursor: pointer;
  }
  .cat button.on { border-color: var(--accent); color: var(--accent); }

  .rule {
    border: 1px solid var(--edge); border-radius: 6px; padding: 9px 11px; margin-bottom: 7px;
    background: var(--panel); font-size: 12px;
  }
  .rule .t { color: var(--ink); }
  .rule .m { color: var(--faint); font-size: 10.5px; margin-top: 5px; font-family: var(--mono); }
  .rule.pick { cursor: pointer; }
  .rule.pick:hover { border-color: var(--accent); }

  .msg { margin-bottom: 12px; }
  .msg .who { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .6px; }
  .msg .txt { margin-top: 3px; white-space: pre-wrap; }
  .msg.blocked .txt { border-left: 2px solid var(--block); padding-left: 10px; }
  .msg.escalated .txt { border-left: 2px solid var(--escalate); padding-left: 10px; }
  .msg.allowed .txt { border-left: 2px solid var(--allow); padding-left: 10px; }
  .why { font-size: 11.5px; color: var(--dim); margin-top: 5px; }
  .why b { color: var(--ink); font-weight: 600; }

  .pass {
    display: flex; align-items: baseline; gap: 8px; font-family: var(--mono);
    font-size: 11px; padding: 3px 0; border-bottom: 1px solid #1c222a;
  }
  .pass .n { flex: 1; color: var(--dim); }
  .pass .v { font-weight: 600; }
  .pass .ms { color: var(--faint); min-width: 46px; text-align: right; }
  .v.ALLOW { color: var(--allow); } .v.BLOCK { color: var(--block); } .v.ESCALATE { color: var(--escalate); }
  .decision { border: 1px solid var(--edge); border-radius: 6px; padding: 10px; margin-bottom: 10px; background: var(--panel); }
  .decision .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .decision .prompt { font-size: 11.5px; color: var(--dim); margin-bottom: 8px; word-break: break-word; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--edge); }
  th { color: var(--faint); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; }
  td.num { font-family: var(--mono); text-align: right; }
  .bar { height: 4px; background: #21262d; border-radius: 2px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--allow); }
  .empty { color: var(--faint); font-size: 12px; padding: 20px 0; text-align: center; }
  code { font-family: var(--mono); font-size: 11px; background: #1c2128; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>WARDEN <span>local AI gateway</span></h1>
  <span class="pill" id="adapter">connecting…</span>
  <span class="pill" id="policyPill">—</span>
  <nav>
    <button class="on" data-tab="console">Console</button>
    <button data-tab="redteam">Red team</button>
  </nav>
</header>

<main id="tab-console">
  <!-- ADMIN ------------------------------------------------------------- -->
  <section>
    <div class="head">Admin <span class="ver" id="ver"></span></div>
    <div class="body">
      <textarea id="ruleText" rows="3" placeholder="Escribí una regla…&#10;p.ej. nadie de ventas puede pedir datos de nómina"></textarea>
      <div class="row">
        <button class="act" id="compile">Compile</button>
        <span id="compileNote" style="font-size:11px;color:var(--faint)"></span>
      </div>

      <div class="cat" id="cats"></div>
      <div id="presetList"></div>

      <div id="draft" style="display:none"></div>

      <div class="head" style="margin:14px -14px 8px;border-top:1px solid var(--edge)">Active rules</div>
      <div id="rules"></div>

      <div class="head" style="margin:14px -14px 8px;border-top:1px solid var(--edge)">Quotas</div>
      <div id="quotas"></div>
    </div>
  </section>

  <!-- EMPLOYEE ----------------------------------------------------------- -->
  <section>
    <div class="head">
      Employee
      <select id="role" style="width:auto;padding:2px 6px;font-size:11px;margin-left:8px"></select>
    </div>
    <div class="body" id="chat"><div class="empty">Send a message to see the guard run.</div></div>
    <div style="padding:12px 14px;border-top:1px solid var(--edge)">
      <textarea id="prompt" rows="2" placeholder="Escribí como empleado…"></textarea>
      <div class="row"><button class="act" id="send">Send</button></div>
    </div>
  </section>

  <!-- TRACE -------------------------------------------------------------- -->
  <section>
    <div class="head">Decision trace <span class="ver" id="sse">●</span></div>
    <div class="body" id="trace"><div class="empty">Live decisions appear here.</div></div>
  </section>
</main>

<main id="tab-redteam" class="single" style="display:none">
  <section>
    <div class="head">Red team</div>
    <div class="body">
      <div class="row" style="margin:0 0 14px">
        <button class="act" id="runRt">Run suite</button>
        <button class="ghost" id="loadRt">Load last report</button>
        <span id="rtNote" style="font-size:11px;color:var(--faint)"></span>
      </div>
      <div id="rtOut"><div class="empty">Run the suite, or load the last report.</div></div>
    </div>
  </section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
