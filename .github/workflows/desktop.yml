# Desktop app: build proof on Linux, installers for macOS and Windows.
#
# The Linux job is the cheap, always-on verification loop: it exercises the
# whole Forge + QVAC-plugin mechanism (bundle, verify, prune, asar-off) and
# boots the packaged app headless in mock mode. The macOS/Windows jobs produce
# the actual artifacts; real on-device inference can only be proven by running
# those on real hardware.
#
# macOS universal builds are rejected by the QVAC plugin (native prebuilds are
# arch-specific), so darwin-arm64 and darwin-x64 are built separately.
name: desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish installers to this release tag (e.g. v0.1.0). Empty = build only.'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'forge.config.cjs'
      - 'qvac.config.json'
      - 'tsconfig.build.json'
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'forge.config.cjs'
      - 'qvac.config.json'
      - 'tsconfig*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop.yml'

# A release run gets a group of its own, keyed on the tag it is publishing, so
# pushing to main while one is building no longer kills it. Cutting five
# releases in an afternoon cancelled four ordinary CI runs and two release runs
# between them, and every one of those shows on the commit list as a red X that
# looks like a failing test and is not: they die in "Set up job", seconds in,
# having run nothing. Ordinary pushes still supersede each other, which is what
# cancel-in-progress is actually for.
concurrency:
  group: >-
    desktop-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
      && format('release-{0}', inputs.release_tag)
      || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}

# Builds only read the repository. Publishing gets its own scoped permission.
permissions:
  contents: read

jobs:
  smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Regression and document extraction tests
        run: pnpm test
      - run: pnpm run build
      - name: Compiled document worker reads PDF and offline OCR
        run: node dist/documents/smoke.js
      - name: Compiled gateway answers in mock mode
        run: |
          WARDEN_ADAPTER=mock WARDEN_PORT=18080 node dist/server/index.js &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/health > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:18080/health | grep -q '"ok":true'
          curl -fs http://127.0.0.1:18080/api/policy > /dev/null
          curl -fs http://127.0.0.1:18080/ | grep -qi '<!doctype html>'
          kill %1
      - name: Package (linux x64 — exercises the QVAC forge plugin)
        run: pnpm exec electron-forge package --platform=linux --arch=x64
      # The smoke run below boots in mock mode, which never spawns the QVAC
      # worker, so it cannot see the one thing that broke inference in four
      # consecutive releases: `bare` shipped 0644 inside the bundle and every
      # spawn died with EACCES, silently, because a process that never starts
      # writes no stderr. Checked here because packaging is where it is fixed
      # and where it can regress.
      - name: The runtime the SDK spawns is executable in the package
        run: |
          # The platform package, not bare-runtime/bin/bare. That one is a
          # 130-byte shim for a shell prompt; the SDK imports
          # bare-runtime/spawn in-process and execs this binary directly, so
          # this is the file whose mode decides whether inference runs.
          BARE=out/Warden-linux-x64/resources/app/node_modules/bare-runtime-linux-x64/bin/bare
          test -f "$BARE" || { echo "not packaged: $BARE"; find out -path '*bare-runtime*' -name bare; exit 1; }
          test -x "$BARE" || { echo "packaged without the execute bit: $(ls -l "$BARE")"; exit 1; }
          "$BARE" --version
      - name: Packaged app boots headless in mock mode
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          WARDEN_SMOKE=1 xvfb-run -a out/Warden-linux-x64/Warden --no-sandbox 2>&1 | tee smoke.log
          grep -q WARDEN_SMOKE_OK smoke.log
      # Last, because it moves the package: `qvac bundle sdk` writes the SDK
      # imports in the worker entry as absolute file:// URLs under the build
      # machine's path, so the worker starts and dies on its first import
      # everywhere except the machine that built it. Nothing above can see
      # that — the smoke run boots in mock mode and never spawns the worker,
      # and even if it did, on this runner the baked-in path is still valid.
      # Only relocating the package reproduces what a user downloads, and a
      # rename is enough.
      - name: The worker entry survives leaving the machine that built it
        run: |
          mv out/Warden-linux-x64 out/relocated
          APP=out/relocated/resources/app
          ENTRY="$APP/qvac/worker.entry.mjs"
          test -f "$ENTRY" || { echo "not packaged: $ENTRY"; exit 1; }
          grep '^import' "$ENTRY"
          if grep -q 'from "file://' "$ENTRY"; then
            echo "the worker entry imports by absolute path — it resolves on this runner and nowhere else"
            exit 1
          fi
          # Bounded because a worker with no RPC config registers its plugins
          # and then idles, which is the passing outcome: exit 124 is the
          # timeout doing its job. The failure this catches is loud and fast.
          ( cd "$APP" && timeout 20 node_modules/bare-runtime-linux-x64/bin/bare qvac/worker.entry.mjs ) \
            > "$GITHUB_WORKSPACE/worker.log" 2>&1 || true
          cat "$GITHUB_WORKSPACE/worker.log"
          if grep -q 'MODULE_NOT_FOUND\|Uncaught' "$GITHUB_WORKSPACE/worker.log"; then
            echo "the worker died on startup"
            exit 1
          fi

  make-macos:
    runs-on: macos-14
    # Apple's notary queue has been observed past an hour on bad days.
    timeout-minutes: 90
    # Intel is best-effort: a slow notarization there must not hold the
    # release hostage. arm64 stays required — it is the deliverable.
    continue-on-error: ${{ matrix.arch == 'x64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    # Present only when the repo has signing secrets configured; forge.config
    # switches signing/notarization on when it sees them.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The x64 build on this arm64 runner needs the darwin-x64 bare runtime;
      # pnpm-workspace.yaml's supportedArchitectures fetches both cpus' optional
      # deps on every install, so nothing extra happens here. The @qvac/*
      # addons ship every arch's prebuilds inside each package regardless.
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - run: pnpm run build
      - run: pnpm exec electron-forge make --platform=darwin --arch=${{ matrix.arch }}
      # The same boot the Linux job smokes, on the .app a Mac user downloads.
      # v0.1.37 built green on every platform and opened on macOS with
      # "lib.missingModels is not a function"; the packaged app had never
      # been started by CI on the platforms it ships for. Only the arm64
      # build, which is this runner's own architecture: the x64 build would
      # need Rosetta and is best-effort above anyway. The report goes to a
      # file because that is what the Windows job has to read, and one
      # mechanism across the three is one fewer to get wrong.
      - name: Packaged app boots in mock mode
        if: matrix.arch == 'arm64'
        run: |
          APP=out/Warden-darwin-arm64/Warden.app/Contents/MacOS/Warden
          test -x "$APP" || { echo "not packaged: $APP"; ls out; exit 1; }
          REPORT="$RUNNER_TEMP/smoke.txt"
          WARDEN_SMOKE=1 WARDEN_SMOKE_FILE="$REPORT" "$APP" > smoke.log 2>&1 &
          for i in $(seq 1 75); do test -f "$REPORT" && break; sleep 2; done
          cat smoke.log
          test -f "$REPORT" || { echo "no smoke report within 150 s"; exit 1; }
          cat "$REPORT"
          grep -q WARDEN_SMOKE_OK "$REPORT"
      - uses: actions/upload-artifact@v4
        with:
          name: warden-darwin-${{ matrix.arch }}
          path: out/make/**
          if-no-files-found: error

  make-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec electron-forge make --platform=win32 --arch=x64
      # The packaged Warden.exe, started the way a user starts it, has to
      # reach its own /health in mock mode. A Windows GUI process has no
      # console to print to, so the shell writes its verdict to the file
      # named in WARDEN_SMOKE_FILE and this step waits for it. Before this
      # step the Windows build was only ever built, never run.
      - name: Packaged app boots in mock mode
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'out\Warden-win32-x64\Warden.exe'
          if (-not (Test-Path $exe)) { Write-Error "not packaged: $exe"; Get-ChildItem out; exit 1 }
          $report = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $env:WARDEN_SMOKE = '1'
          $env:WARDEN_SMOKE_FILE = $report
          $p = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(150)
          while (-not (Test-Path $report) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $report)) { Write-Error "no smoke report within 150 s (process exited: $($p.HasExited))"; exit 1 }
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern 'WARDEN_SMOKE_OK' -Quiet)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: warden-win32-x64
          path: out/make/**
          if-no-files-found: error

  # Installers land on the repo's Releases page — stable download links
  # instead of digging through a run's artifacts. Two ways in: push a v* tag,
  # or dispatch the workflow with release_tag set (the release step then
  # creates that tag via the API, for environments that cannot push tags).
  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [smoke-linux, make-macos, make-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
